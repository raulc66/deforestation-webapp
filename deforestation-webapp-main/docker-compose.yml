# ForestWatch local stack: MongoDB + API + frontend.
# From this directory: docker compose up --build
# UI: http://localhost:3000/  demo: http://localhost:3000/explore  API: http://localhost:8000/api/health
#
# Development defaults only. Do not use this file as a production deployment.
# FORESTWATCH_ENV=development so production-safety checks do not apply.

services:
  mongo:
    image: mongo:7
    volumes:
      - forestwatch-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      FORESTWATCH_ENV: development
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: forestwatch
      JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production-32
      ADMIN_EMAIL: admin@localhost
      ADMIN_PASSWORD: dev-admin-change-me
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      ENABLE_BILLING: "false"
      ENABLE_BACKGROUND_INGESTION: "true"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  forestwatch-mongo:
